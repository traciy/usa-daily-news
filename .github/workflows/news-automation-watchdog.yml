name: USA Daily News Automation Watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: usa-daily-news-watchdog
  cancel-in-progress: false

jobs:
  monitor-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the main automation and recover missed schedule events
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          MAIN_WORKFLOW_ID: "389035432"
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.REPOSITORY;
          const workflowId = process.env.MAIN_WORKFLOW_ID;
          const api = process.env.GITHUB_API_URL || "https://api.github.com";
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          };

          const response = await fetch(
            `${api}/repos/${repo}/actions/workflows/${workflowId}/runs?per_page=100`,
            { headers }
          );
          if (!response.ok) {
            throw new Error(`Could not inspect automation runs: HTTP ${response.status} ${await response.text()}`);
          }

          const data = await response.json();
          const runs = data.workflow_runs || [];
          const now = Date.now();
          const active = runs.find((run) => ["queued", "in_progress", "waiting", "pending"].includes(run.status));
          if (active) {
            console.log(`Main automation is already ${active.status} (run ${active.id}); no duplicate dispatch.`);
            process.exit(0);
          }

          const latestSchedule = runs
            .filter((run) => run.event === "schedule")
            .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
          const latestDispatch = runs
            .filter((run) => run.event === "workflow_dispatch")
            .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];

          const scheduleAgeMinutes = latestSchedule
            ? (now - Date.parse(latestSchedule.created_at)) / 60000
            : Infinity;
          const dispatchAgeMinutes = latestDispatch
            ? (now - Date.parse(latestDispatch.created_at)) / 60000
            : Infinity;

          console.log(`Last scheduled run age: ${Number.isFinite(scheduleAgeMinutes) ? scheduleAgeMinutes.toFixed(1) + " minutes" : "none found"}.`);

          if (scheduleAgeMinutes <= 8) {
            console.log("The normal schedule is recent; no recovery dispatch is needed.");
            process.exit(0);
          }

          if (dispatchAgeMinutes < 4) {
            console.log("A recovery/manual run was started recently; waiting before another dispatch.");
            process.exit(0);
          }

          console.log("The scheduled trigger appears to have been missed. Dispatching the main workflow as a publishing run.");
          const dispatch = await fetch(
            `${api}/repos/${repo}/actions/workflows/${workflowId}/dispatches`,
            {
              method: "POST",
              headers: { ...headers, "Content-Type": "application/json" },
              body: JSON.stringify({ ref: "main", inputs: { publish: "true" } }),
            }
          );
          if (!dispatch.ok) {
            throw new Error(`Recovery dispatch failed: HTTP ${dispatch.status} ${await dispatch.text()}`);
          }
          console.log("Recovery dispatch accepted by GitHub.");
          NODE
