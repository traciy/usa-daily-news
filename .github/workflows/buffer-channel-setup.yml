# One-time discovery for the already connected USA Daily News X channel
name: Set up Buffer X channel

on:
  push:
    paths:
      - ".github/workflows/buffer-channel-setup.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  discover-channel:
    runs-on: ubuntu-latest
    steps:
      - name: Find the connected X channel and save its ID
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const apiKey = process.env.BUFFER_API_KEY;
          const githubToken = process.env.GITHUB_TOKEN;
          const repository = process.env.GITHUB_REPOSITORY;

          if (!apiKey) throw new Error("BUFFER_API_KEY is missing from GitHub repository secrets.");

          async function bufferQuery(query) {
            const response = await fetch("https://api.buffer.com", {
              method: "POST",
              headers: {
                Authorization: "Bearer " + apiKey,
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify({ query }),
            });
            const body = await response.json();
            if (!response.ok || body.errors?.length) {
              throw new Error("Buffer API error: " + (body.errors || []).map((e) => e.message).join("; "));
            }
            return body.data;
          }

          const account = await bufferQuery(`
            query GetOrganizations {
              account {
                organizations { id name }
              }
            }
          `);

          const organizations = account?.account?.organizations || [];
          if (!organizations.length) throw new Error("No Buffer organization was found for this API key.");

          const matches = [];
          for (const organization of organizations) {
            const data = await bufferQuery(`
              query GetChannels {
                channels(input: { organizationId: "${organization.id}" }) {
                  id
                  name
                  displayName
                  service
                }
              }
            `);
            for (const channel of data?.channels || []) {
              if (String(channel.service).toLowerCase() === "twitter") {
                matches.push({ id: channel.id, name: channel.displayName || channel.name || "X", organization: organization.name });
              }
            }
          }

          if (matches.length !== 1) {
            const safeList = matches.map((item) => item.name + " (" + item.organization + ")").join(", ");
            throw new Error(
              matches.length === 0
                ? "No X/Twitter channel was found. Confirm your X account is connected in Buffer."
                : "More than one X/Twitter channel was found: " + safeList + ". Keep only the intended USA Daily News X channel connected, or select one before continuing.",
            );
          }

          const channel = matches[0];
          const [owner, repo] = repository.split("/");
          const base = "https://api.github.com/repos/" + owner + "/" + repo + "/actions/variables";
          const headers = {
            Authorization: "Bearer " + githubToken,
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            "Content-Type": "application/json",
          };
          const payload = { name: "BUFFER_CHANNEL_ID", value: channel.id };

          const existing = await fetch(base + "/BUFFER_CHANNEL_ID", { headers });
          let saved;
          if (existing.status === 404) {
            saved = await fetch(base, { method: "POST", headers, body: JSON.stringify(payload) });
          } else if (existing.ok) {
            saved = await fetch(base + "/BUFFER_CHANNEL_ID", { method: "PATCH", headers, body: JSON.stringify(payload) });
          } else {
            throw new Error("Could not check the GitHub repository variable (HTTP " + existing.status + ").");
          }

          if (!saved.ok) {
            throw new Error("Could not save BUFFER_CHANNEL_ID in GitHub (HTTP " + saved.status + "): " + (await saved.text()).slice(0, 700));
          }

          console.log("Connected Buffer channel: " + channel.name + " (" + channel.organization + ")");
          console.log("Saved BUFFER_CHANNEL_ID as a GitHub Actions repository variable.");
          console.log("Buffer channel ID: " + channel.id);
          await import("node:fs/promises").then(({ appendFile }) =>
            appendFile(process.env.GITHUB_STEP_SUMMARY,
              "## Buffer X channel configured\n\nConnected channel: **" + channel.name + "**\n\nThe channel ID was saved in GitHub repository variables as `BUFFER_CHANNEL_ID`.\n",
            ),
          );
          NODE
