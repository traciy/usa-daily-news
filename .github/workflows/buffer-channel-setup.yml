# One-time discovery for connected USA Daily News X and Substack channels
name: Set up Buffer X and Substack channels

on:
  push:
    paths:
      - ".github/workflows/buffer-channel-setup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-channel:
    runs-on: ubuntu-latest
    steps:
      - name: Find the connected X and Substack channel IDs
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const apiKey = process.env.BUFFER_API_KEY;
          const githubToken = process.env.GITHUB_TOKEN;
          const repository = process.env.GITHUB_REPOSITORY;

          if (!apiKey) throw new Error("BUFFER_API_KEY is missing from GitHub repository secrets.");

          async function bufferQuery(query) {
            const response = await fetch("https://api.buffer.com", {
              method: "POST",
              headers: {
                Authorization: "Bearer " + apiKey,
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify({ query }),
            });
            const body = await response.json();
            if (!response.ok || body.errors?.length) {
              throw new Error("Buffer API error: " + (body.errors || []).map((e) => e.message).join("; "));
            }
            return body.data;
          }

          const account = await bufferQuery(`
            query GetOrganizations {
              account {
                organizations { id name }
              }
            }
          `);

          const organizations = account?.account?.organizations || [];
          if (!organizations.length) throw new Error("No Buffer organization was found for this API key.");

          const matches = { twitter: [], substack: [] };
          for (const organization of organizations) {
            const data = await bufferQuery(\`
              query GetChannels {
                channels(input: { organizationId: "\${organization.id}" }) {
                  id
                  name
                  displayName
                  service
                }
              }
            \`);
            for (const channel of data?.channels || []) {
              const service = String(channel.service).toLowerCase();
              const entry = {
                id: channel.id,
                name: channel.displayName || channel.name || service,
                organization: organization.name,
              };
              if (service === "twitter") matches.twitter.push(entry);
              if (service === "substack") matches.substack.push(entry);
            }
          }

          for (const [service, label] of [["twitter", "X/Twitter"], ["substack", "Substack"]]) {
            if (matches[service].length !== 1) {
              const safeList = matches[service].map((item) => item.name + " (" + item.organization + ")").join(", ");
              throw new Error(
                matches[service].length === 0
                  ? "No " + label + " channel was found. Confirm it is connected in Buffer."
                  : "More than one " + label + " channel was found: " + safeList + ". Keep only the intended channel connected.",
              );
            }
          }

          const xChannel = matches.twitter[0];
          const substackChannel = matches.substack[0];
          console.log("Connected X channel: " + xChannel.name + " (" + xChannel.organization + ")");
          console.log("BUFFER_X_CHANNEL_ID=" + xChannel.id);
          console.log("Connected Substack channel: " + substackChannel.name + " (" + substackChannel.organization + ")");
          console.log("BUFFER_SUBSTACK_CHANNEL_ID=" + substackChannel.id);
          await import("node:fs/promises").then(({ appendFile }) =>
            appendFile(process.env.GITHUB_STEP_SUMMARY,
              "## Buffer channels found\\n\\nConnected X channel: **" + xChannel.name + "**\\n\\nAdd this repository variable in GitHub Settings → Secrets and variables → Actions → Variables:\\n\\n- Name: \`BUFFER_X_CHANNEL_ID\`\\n- Value: \`" + xChannel.id + "\`\\n\\nConnected Substack channel: **" + substackChannel.name + "**\\n\\n- Name: \`BUFFER_SUBSTACK_CHANNEL_ID\`\\n- Value: \`" + substackChannel.id + "\`\\n",
            ),
          );
          NODE
