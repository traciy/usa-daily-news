name: Deploy USA Daily News to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-usa-daily-news
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check required deployment settings
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$FOOTBALL_DATA_API_KEY" || { echo "Missing GitHub secret: FOOTBALL_DATA_API_KEY"; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "Missing GitHub secret: VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing GitHub secret: VITE_SUPABASE_ANON_KEY"; exit 1; }
          case "$VITE_SUPABASE_URL" in
            https://dyabpvcqedeioarkgjlz.supabase.co) ;;
            *) echo "VITE_SUPABASE_URL is not set to the new Supabase project."; exit 1 ;;
          esac

      - name: Build website with the new Supabase connection
        run: npm run build

      - name: Prepare Worker secrets for deployment
        shell: bash
        run: |
          node -e 'const fs=require("fs"); fs.writeFileSync("/tmp/worker-secrets.json", JSON.stringify({SUPABASE_URL:process.env.VITE_SUPABASE_URL,SUPABASE_ANON_KEY:process.env.VITE_SUPABASE_ANON_KEY,FOOTBALL_DATA_API_KEY:process.env.FOOTBALL_DATA_API_KEY}));'

      - name: Deploy website, Worker, and secrets together
        run: npx --yes wrangler@4.156.0 deploy --config wrangler.jsonc --secrets-file /tmp/worker-secrets.json
