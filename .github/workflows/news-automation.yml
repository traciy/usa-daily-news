name: USA Daily News Automation

on:
  schedule:
    - cron: "7 * * * *" # Once per hour (GitHub Actions cron uses UTC)
  workflow_dispatch:
    inputs:
      image_backfill_only:
        description: "Repair missing article images only (do not publish new stories)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: usa-daily-news-automation
  cancel-in-progress: false

jobs:
  generate-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
      GEMINI_MODEL: gemini-3.5-flash-lite
      ARTICLE_COUNT: "10"
      MIN_ARTICLES: "1"
      ARTICLE_WORDS: "250"
      SUPABASE_FUNCTION_URL: https://dyabpvcqedeioarkgjlz.supabase.co/functions/v1/api-articles
      SUPABASE_BEARER_TOKEN: ${{ secrets.SUPABASE_BEARER_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_X_CHANNEL_ID: "6aeb3ae6e29c69a1715d3a4c"
      BUFFER_SUBSTACK_CHANNEL_ID: "6aeb3c18e29c69a1715d54aa"
      PUBLISH_ENABLED: "true"
      IMAGE_BACKFILL_ONLY: ${{ inputs.image_backfill_only }}

    steps:
      - name: Download repository code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check automation script syntax
        run: node --check scripts/news-automation.mjs

      - name: Check trending-topic script syntax
        run: node --check scripts/trending-us-topics.mjs

      - name: Discover and score current US trends
        id: trends
        continue-on-error: true
        run: node scripts/trending-us-topics.mjs

      - name: Run news automation
        run: node scripts/news-automation.mjs
